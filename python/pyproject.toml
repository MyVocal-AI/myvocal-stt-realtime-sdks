[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "myvocal-stt-realtime"
version = "1.0.0"
description = "MyVocal Speech to Text Realtime SDK (server-side): typed sessions, framing, rotation and REST close-out."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "MyVocal"}]
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=15.0,<17",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://myvocal.ai"
Documentation = "https://docs.myvocal.ai"
Repository = "https://github.com/MyVocal-AI/myvocal-stt-realtime-sdks"
Issues = "https://github.com/MyVocal-AI/myvocal-stt-realtime-sdks/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myvocal_stt_realtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
